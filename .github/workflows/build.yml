name: Build VaporStep

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: VaporStep-Linux-x86_64
            package: VaporStep-Linux-x86_64.tar.gz
          - os: windows-latest
            artifact: VaporStep-Windows-x86_64
            package: VaporStep-Windows-x86_64.exe
          - os: macos-latest
            artifact: VaporStep-macOS-AppleSilicon
            package: VaporStep-macOS-AppleSilicon.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[build]"

      - name: Run tests
        run: python -m pytest -q

      - name: Download bundled pose model
        run: python scripts/fetch_pose_model.py

      - name: Build macOS icon
        if: runner.os == 'macOS'
        run: ./scripts/make_macos_icon.sh

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          if [[ -z "${MACOS_CERTIFICATE_BASE64}" || -z "${MACOS_CERTIFICATE_PASSWORD}" || -z "${MACOS_SIGNING_IDENTITY}" ]]; then
            echo "macOS signing credentials are not configured" >&2
            exit 1
          fi

          CERTIFICATE_PATH="${RUNNER_TEMP}/vaporstep-developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/vaporstep-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "${MACOS_CERTIFICATE_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          rm -f "${CERTIFICATE_PATH}"

      - name: Build application
        env:
          VAPORSTEP_CODESIGN_IDENTITY: ${{ runner.os == 'macOS' && vars.MACOS_SIGNING_IDENTITY || '' }}
        run: pyinstaller --noconfirm --clean VaporStep.spec

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/VaporStep.app
          codesign -dvvv dist/VaporStep.app

      - name: Notarize and staple macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_NOTARY_KEY_BASE64}" || -z "${APPLE_NOTARY_KEY_ID}" || -z "${APPLE_NOTARY_ISSUER_ID}" ]]; then
            echo "Apple notarization credentials are not configured" >&2
            exit 1
          fi

          NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          NOTARY_ZIP="${RUNNER_TEMP}/VaporStep-notarize.zip"

          printf '%s' "${APPLE_NOTARY_KEY_BASE64}" | base64 --decode > "${NOTARY_KEY_PATH}"
          chmod 600 "${NOTARY_KEY_PATH}"

          ditto -c -k --sequesterRsrc --keepParent dist/VaporStep.app "${NOTARY_ZIP}"
          xcrun notarytool submit "${NOTARY_ZIP}" \
            --key "${NOTARY_KEY_PATH}" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}" \
            --wait

          xcrun stapler staple dist/VaporStep.app
          xcrun stapler validate dist/VaporStep.app
          spctl --assess --type execute --verbose=4 dist/VaporStep.app

          rm -f "${NOTARY_KEY_PATH}" "${NOTARY_ZIP}"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C dist -czf "${{ matrix.package }}" VaporStep

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/VaporStep.exe "${{ matrix.package }}"

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/VaporStep.app "${{ matrix.package }}"

      - name: Clean up macOS signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/vaporstep-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f \
            "${RUNNER_TEMP}/vaporstep-developer-id.p12" \
            "${RUNNER_TEMP}"/AuthKey_*.p8 \
            "${RUNNER_TEMP}/VaporStep-notarize.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "VaporStep ${GITHUB_REF_NAME}"

          gh release upload "${GITHUB_REF_NAME}" \
            release-artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
