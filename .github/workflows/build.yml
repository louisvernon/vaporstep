name: Build VaporStep

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: VaporStep-Linux-x86_64
            package: VaporStep-Linux-x86_64.tar.gz
          - os: macos-latest
            artifact: VaporStep-macOS-AppleSilicon
            package: VaporStep-macOS-AppleSilicon.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[build]"

      - name: Run tests
        run: python -m pytest -q

      - name: Download bundled pose model
        run: python scripts/fetch_pose_model.py

      - name: Build macOS icon
        if: runner.os == 'macOS'
        run: ./scripts/make_macos_icon.sh

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          if [[ -z "${MACOS_CERTIFICATE_BASE64}" || -z "${MACOS_CERTIFICATE_PASSWORD}" || -z "${MACOS_SIGNING_IDENTITY}" ]]; then
            echo "macOS signing credentials are not configured" >&2
            exit 1
          fi

          CERTIFICATE_PATH="${RUNNER_TEMP}/vaporstep-developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/vaporstep-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "${MACOS_CERTIFICATE_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          rm -f "${CERTIFICATE_PATH}"

      - name: Build application
        env:
          VAPORSTEP_CODESIGN_IDENTITY: ${{ runner.os == 'macOS' && vars.MACOS_SIGNING_IDENTITY || '' }}
        run: pyinstaller --noconfirm --clean VaporStep.spec

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/VaporStep.app
          codesign -dvvv dist/VaporStep.app

      - name: Notarize and staple macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_NOTARY_KEY_BASE64}" || -z "${APPLE_NOTARY_KEY_ID}" || -z "${APPLE_NOTARY_ISSUER_ID}" ]]; then
            echo "Apple notarization credentials are not configured" >&2
            exit 1
          fi

          NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          NOTARY_ZIP="${RUNNER_TEMP}/VaporStep-notarize.zip"

          printf '%s' "${APPLE_NOTARY_KEY_BASE64}" | base64 --decode > "${NOTARY_KEY_PATH}"
          chmod 600 "${NOTARY_KEY_PATH}"

          ditto -c -k --sequesterRsrc --keepParent dist/VaporStep.app "${NOTARY_ZIP}"
          xcrun notarytool submit "${NOTARY_ZIP}" \
            --key "${NOTARY_KEY_PATH}" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}" \
            --wait

          xcrun stapler staple dist/VaporStep.app
          xcrun stapler validate dist/VaporStep.app
          spctl --assess --type execute --verbose=4 dist/VaporStep.app

          rm -f "${NOTARY_KEY_PATH}" "${NOTARY_ZIP}"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x dist/VaporStep/VaporStep
          tar -C dist -czf "${{ matrix.package }}" VaporStep

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/VaporStep.app "${{ matrix.package }}"

      - name: Clean up macOS signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/vaporstep-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f \
            "${RUNNER_TEMP}/vaporstep-developer-id.p12" \
            "${RUNNER_TEMP}"/AuthKey_*.p8 \
            "${RUNNER_TEMP}/VaporStep-notarize.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  build-windows:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[build]"

      - name: Record build environment
        shell: pwsh
        run: |
          python -VV
          python -m pip freeze

      - name: Verify native vision stack
        shell: pwsh
        run: |
          python -c "import cv2, mediapipe, numpy; print('OpenCV', cv2.__version__, 'MediaPipe', mediapipe.__version__, 'NumPy', numpy.__version__)"

      - name: Run tests
        run: python -m pytest -q

      - name: Download bundled pose model
        run: python scripts/fetch_pose_model.py

      - name: Build application folder
        run: pyinstaller --noconfirm --clean VaporStep.spec

      - name: Install Inno Setup 6.7.1
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Pinned Inno Setup compiler was not installed at $iscc."
          }
          Write-Host "Inno Setup $((Get-Item $iscc).VersionInfo.FileVersion)"

      - name: Package portable application
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\VaporStep `
            -DestinationPath VaporStep-Windows-x86_64-Portable.zip `
            -CompressionLevel Optimal

      - name: Build Windows installer
        shell: pwsh
        run: |
          $rawVersion = python -c "from vaporstep import __version__; print(__version__.split('+', 1)[0])"
          if ($rawVersion -notmatch '^(\d+)\.(\d+)\.(\d+)') {
            throw "Cannot derive a numeric installer version from '$rawVersion'."
          }
          $displayVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $numericVersion = "$displayVersion.0"
          $sourceDir = (Resolve-Path dist\VaporStep).Path
          $outputDir = (Resolve-Path .).Path
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }
          & $iscc `
            "/DAppVersion=$displayVersion" `
            "/DAppNumericVersion=$numericVersion" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            installer\windows\VaporStep.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Write Windows checksums
        shell: pwsh
        run: |
          @(
            "VaporStep-Windows-x86_64-Portable.zip",
            "VaporStep-Windows-x86_64-Setup.exe"
          ) | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$_"
          } | Set-Content SHA256SUMS-Windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VaporStep-Windows-x86_64
          path: |
            VaporStep-Windows-x86_64-Portable.zip
            VaporStep-Windows-x86_64-Setup.exe
            SHA256SUMS-Windows.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-unix, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "VaporStep ${GITHUB_REF_NAME}"

          gh release upload "${GITHUB_REF_NAME}" \
            release-artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
