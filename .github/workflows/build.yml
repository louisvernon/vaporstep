name: Build VaporStep

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: VaporStep-Linux-x86_64
          - os: windows-latest
            artifact: VaporStep-Windows-x86_64
          - os: macos-15-intel
            artifact: VaporStep-macOS-Intel
          - os: macos-latest
            artifact: VaporStep-macOS-AppleSilicon

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[build]"

      - name: Run tests
        run: python -m pytest -q

      - name: Download bundled pose model
        run: python scripts/fetch_pose_model.py

      - name: Build macOS icon
        if: runner.os == 'macOS'
        run: ./scripts/make_macos_icon.sh

      - name: Build application
        run: pyinstaller --noconfirm --clean VaporStep.spec

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C dist -czf "${{ matrix.artifact }}.tar.gz" VaporStep

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/VaporStep -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/VaporStep.app "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ matrix.artifact }}.zip" \
            "${{ matrix.artifact }}.tar.gz" \
            --clobber

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "VaporStep ${GITHUB_REF_NAME}"
