name: Build VaporStep

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: VaporStep-Linux-x86_64
            package: VaporStep-Linux-x86_64.tar.gz
          - os: windows-latest
            artifact: VaporStep-Windows-x86_64
            package: VaporStep-Windows-x86_64.zip
          - os: macos-15-intel
            artifact: VaporStep-macOS-Intel
            package: VaporStep-macOS-Intel.zip
          - os: macos-latest
            artifact: VaporStep-macOS-AppleSilicon
            package: VaporStep-macOS-AppleSilicon.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[build]"

      - name: Run tests
        run: python -m pytest -q

      - name: Download bundled pose model
        run: python scripts/fetch_pose_model.py

      - name: Build macOS icon
        if: runner.os == 'macOS'
        run: ./scripts/make_macos_icon.sh

      - name: Build application
        run: pyinstaller --noconfirm --clean VaporStep.spec

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C dist -czf "${{ matrix.package }}" VaporStep

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/VaporStep -DestinationPath "${{ matrix.package }}"

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/VaporStep.app "${{ matrix.package }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "VaporStep ${GITHUB_REF_NAME}"

          gh release upload "${GITHUB_REF_NAME}" \
            release-artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
