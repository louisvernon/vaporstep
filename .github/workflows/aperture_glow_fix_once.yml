name: Aperture glow fix once

on:
  push:
    branches: ["agent/flatten-renderer"]
    paths: [".github/workflows/aperture_glow_fix_once.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply aperture glow fix
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import textwrap

          path = Path("vaporstep/renderer.py")
          text = path.read_text(encoding="utf-8")
          tree = ast.parse(text)
          cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == "Renderer")
          node = next(n for n in cls.body if isinstance(n, ast.FunctionDef) and n.name == "_draw_source_glow")
          replacement = r'''
          def _aperture_target_points(
              self,
              kind: NoteKind,
              lane: int,
          ) -> tuple[list[tuple[int, int]], int]:
              """Return a pre-entry cue that sits inside the tunnel opening."""
              inner, _, _ = self._hand_tunnel_geometry()
              cx, base_y, rx, ry = inner

              if kind == NoteKind.HANDS:
                  start = _HAND_BOUNDARIES[lane - 1]
                  end = _HAND_BOUNDARIES[lane]
                  center = _HAND_CENTERS[lane - 1]
                  half = (end - start) * 0.5 * _HAND_NOTE_ARC_FRACTION
                  inset = 0.16
                  points = []
                  samples = 18
                  for i in range(samples + 1):
                      along = center - half + (2.0 * half) * i / samples
                      x, y = self._ellipse_upper_point(inner, along)
                      points.append((
                          int(cx + (x - cx) * (1.0 - inset)),
                          int(base_y + (y - base_y) * (1.0 - inset)),
                      ))
                  return points, 5

              left = cx - rx * 0.84
              right = cx + rx * 0.84
              lane_width = (right - left) / 4.0
              lane_left = left + (lane - 1) * lane_width
              lane_right = lane_left + lane_width
              pad = max(2.0, lane_width * 0.08)
              y = base_y - max(5.0, ry * 0.12)
              return (
                  [(int(lane_left + pad), int(y)), (int(lane_right - pad), int(y))],
                  5,
              )

          def _draw_source_glow(
              self,
              surface: pygame.Surface,
              kind: NoteKind,
              lane: int,
              progress: float,
              intensity: float,
              *,
              preentry: bool = False,
          ) -> None:
              theme = MAGENTA if kind == NoteKind.HANDS else CYAN
              if preentry:
                  points, core_width = self._aperture_target_points(kind, lane)
                  boost = 1.15 if kind == NoteKind.FOOT else 0.92
                  self._draw_preentry_glow(
                      surface,
                      points,
                      theme,
                      intensity * boost,
                      core_width,
                  )
                  return

              self._draw_outward_glow(
                  surface,
                  kind,
                  lane,
                  max(0.0, min(1.0, progress)),
                  theme,
                  intensity,
              )
          '''
          replacement = textwrap.indent(textwrap.dedent(replacement).strip("\n"), "    ") + "\n"
          lines = text.splitlines(keepends=True)
          lines[node.lineno - 1:node.end_lineno] = [replacement]
          path.write_text("".join(lines), encoding="utf-8")
          ast.parse(path.read_text(encoding="utf-8"))
          PY
      - name: Install dependencies
        run: python -m pip install -e ".[build]"
      - name: Run tests
        run: python -m pytest -q
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vaporstep/renderer.py
          git commit -m "Restore pre-entry glow inside tunnel aperture"
          git push
