name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[build]"

      - name: Run tests
        run: python -m pytest -q

      - name: Verify generated model documentation
        shell: bash
        run: |
          python scripts/generate_model_docs.py
          git diff --exit-code -- MODEL_ASSETS.md
