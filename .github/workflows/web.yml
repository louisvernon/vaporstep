name: Web Prototype

on:
  pull_request:
  push:
    branches: ["agent/vaportap-wasm"]
  workflow_dispatch:

jobs:
  build-web:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install web build tools
        run: >-
          python -m pip install
          pygame-ce==2.5.8
          pygbag==0.9.3
          simfile==2.1.1
          setuptools==80.9.0

      - name: Stage web-safe application
        shell: bash
        run: |
          rm -rf web-dist
          mkdir -p web-dist/vaporstep
          cp main.py web-dist/main.py
          cp vaporstep/web_vaportap.py web-dist/vaporstep/web_vaportap.py
          cp vaporstep/web_vaportap_session.py web-dist/vaporstep/web_vaportap_session.py
          cp vaporstep/web_demo.sm web-dist/vaporstep/web_demo.sm
          cp vaporstep/playfield_geometry.py web-dist/vaporstep/playfield_geometry.py
          cp vaporstep/config.py web-dist/vaporstep/config.py
          cp vaporstep/domain.py web-dist/vaporstep/domain.py
          cp vaporstep/session.py web-dist/vaporstep/session.py
          cp vaporstep/audio_config.py web-dist/vaporstep/audio_config.py
          cp vaporstep/adaptive_sampling.py web-dist/vaporstep/adaptive_sampling.py
          cp vaporstep/camera_samples.py web-dist/vaporstep/camera_samples.py
          cp vaporstep/debug_state.py web-dist/vaporstep/debug_state.py
          cp vaporstep/chains.py web-dist/vaporstep/chains.py
          cp vaporstep/motion.py web-dist/vaporstep/motion.py
          cp vaporstep/scoring.py web-dist/vaporstep/scoring.py
          cp vaporstep/song.py web-dist/vaporstep/song.py
          cp vaporstep/simfile_loader.py web-dist/vaporstep/simfile_loader.py
          # GameSession currently needs only the volume constant from audio_fx.
          # Keep NumPy synthesis out of the WASM dependency graph while this
          # platform seam is promoted into the shared source module.
          sed -i 's/from \.audio_fx import GAMEPLAY_MUSIC_VOLUME/from .audio_config import GAMEPLAY_MUSIC_VOLUME/' web-dist/vaporstep/session.py
          printf '%s\n' '"""Web-safe VaporStep/VaporTap package."""' > web-dist/vaporstep/__init__.py

          # simfile 2.1.1 and its runtime dependencies are pure Python. Vendor
          # them into the static app so mobile startup does not depend on a
          # second package/CDN fetch. find_spec avoids importing old fs before
          # the package tree has been staged.
          python - <<'PY'
          from importlib.util import find_spec
          from pathlib import Path
          import shutil

          destination = Path("web-dist")
          for name in ("simfile", "msdparser", "fs", "pkg_resources"):
              spec = find_spec(name)
              if spec is None or not spec.submodule_search_locations:
                  raise RuntimeError(f"Could not locate package {name}")
              source = Path(next(iter(spec.submodule_search_locations))).resolve()
              shutil.copytree(source, destination / name)

          for name in ("appdirs", "six"):
              spec = find_spec(name)
              if spec is None or spec.origin is None:
                  raise RuntimeError(f"Could not locate module {name}")
              shutil.copy2(spec.origin, destination / Path(spec.origin).name)
          PY

      - name: Check staged shared pipeline
        shell: bash
        run: |
          python -m py_compile web-dist/main.py web-dist/vaporstep/*.py
          PYTHONPATH=web-dist python - <<'PY'
          from pathlib import Path
          from vaporstep.domain import BodyState, ChainMode
          from vaporstep.session import GameSession
          from vaporstep.simfile_loader import load_chart, scan_song

          path = Path("web-dist/vaporstep/web_demo.sm")
          song = scan_song(path)
          assert song is not None and song.charts
          chart = load_chart(song, song.charts[0])
          assert chart.notes
          session = GameSession(chart=chart, chain_mode=ChainMode.OFF)
          session.update(BodyState(), ready_to_start=True, start_immediately=True)
          assert session.running
          print(
              f"shared pipeline: {song.title!r}, "
              f"{len(chart.notes)} notes, {len(chart.sustains)} sustains"
          )
          PY

      - name: Build WASM bundle
        run: python -m pygbag --build --PYBUILD 3.12 --title "VaporTap Shared-Core Playtest" web-dist

      - name: Mark preview as non-indexable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("web-dist/build/web/index.html")
          text = index.read_text(encoding="utf-8")
          marker = '<meta name="robots" content="noindex, nofollow, noarchive">'
          if marker not in text:
              text = text.replace("<head>", f"<head>\n    {marker}", 1)
              index.write_text(text, encoding="utf-8")
          Path("web-dist/build/web/robots.txt").write_text(
              "User-agent: *\nDisallow: /\n",
              encoding="utf-8",
          )
          PY

      - name: Verify web output
        shell: bash
        run: |
          test -f web-dist/build/web/index.html
          grep -q 'noindex, nofollow, noarchive' web-dist/build/web/index.html
          find web-dist/build/web -maxdepth 2 -type f -print | sort

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-dist/build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-web
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
