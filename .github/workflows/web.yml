name: Web Prototype

on:
  pull_request:
  push:
    branches: ["agent/vaportap-wasm"]
  workflow_dispatch:

jobs:
  build-web:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install web build tools
        run: python -m pip install pygame-ce==2.5.8 pygbag==0.9.3

      - name: Stage web-safe application
        shell: bash
        run: |
          rm -rf web-dist
          mkdir -p web-dist/vaporstep
          cp main.py web-dist/main.py
          cp vaporstep/web_vaportap.py web-dist/vaporstep/web_vaportap.py
          cp vaporstep/playfield_geometry.py web-dist/vaporstep/playfield_geometry.py
          cp vaporstep/config.py web-dist/vaporstep/config.py
          cp vaporstep/domain.py web-dist/vaporstep/domain.py
          printf '%s\n' '"""Web-safe VaporTap package."""' > web-dist/vaporstep/__init__.py

      - name: Check staged Python
        run: python -m py_compile web-dist/main.py web-dist/vaporstep/*.py

      - name: Build WASM bundle
        run: python -m pygbag --build --PYBUILD 3.12 --title "VaporTap Playtest" web-dist

      - name: Mark preview as non-indexable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("web-dist/build/web/index.html")
          text = index.read_text(encoding="utf-8")
          marker = '<meta name="robots" content="noindex, nofollow, noarchive">'
          if marker not in text:
              text = text.replace("<head>", f"<head>\n    {marker}", 1)
              index.write_text(text, encoding="utf-8")
          Path("web-dist/build/web/robots.txt").write_text(
              "User-agent: *\nDisallow: /\n",
              encoding="utf-8",
          )
          PY

      - name: Verify web output
        shell: bash
        run: |
          test -f web-dist/build/web/index.html
          grep -q 'noindex, nofollow, noarchive' web-dist/build/web/index.html
          find web-dist/build/web -maxdepth 2 -type f -print | sort

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-dist/build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-web
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
