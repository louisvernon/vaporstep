[build-system]
requires = ["setuptools==80.9.0", "wheel", "setuptools-scm>=9.2,<10"]
build-backend = "setuptools.build_meta"

[project]
name = "vaporstep"
dynamic = ["version"]
description = "Cross-platform webcam full-body rhythm game"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  # Keep the native vision stack reproducible across local and release builds.
  "mediapipe==0.10.31",
  "opencv-python==5.0.0.93",
  # pygame-ce keeps the same `import pygame` API while giving us a supported
  # path to pygbag/Emscripten for the experimental VaporTap web target.
  "pygame-ce==2.5.8",
  "numpy==2.5.2",
  "simfile==2.1.1",
  # pygame-ce does not require pkg_resources, but keep setuptools pinned while
  # the rest of the packaging stack remains unchanged in this compatibility spike.
  "setuptools==80.9.0",
  "imageio-ffmpeg==0.6.0",
]

[project.scripts]
vaporstep = "vaporstep.app:main"

[tool.setuptools.packages.find]
include = ["vaporstep*"]

[tool.setuptools_scm]
version_file = "vaporstep/_version.py"

[project.optional-dependencies]
build = [
  "pyinstaller==6.22.2",
  "pyinstaller-hooks-contrib==2026.6",
  "pytest>=8",
  "pillow>=10",
]
