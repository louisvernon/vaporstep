[build-system]
requires = ["setuptools==80.9.0", "wheel", "setuptools-scm>=9.2,<10"]
build-backend = "setuptools.build_meta"

[project]
name = "vaporstep"
dynamic = ["version"]
description = "Cross-platform webcam full-body rhythm game"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  # Keep the native vision stack reproducible across local and release builds.
  "mediapipe==0.10.33",
  # opencv-contrib-python includes the core cv2 modules MediaPipe and VaporStep
  # use. Installing opencv-python beside it makes two distributions overwrite
  # the same cv2 package.
  "opencv-contrib-python==4.11.0.86",
  "pygame==2.6.1",
  "numpy==1.26.4",
  "protobuf==4.25.9",
  "simfile==2.1.1",
  # Pygame 2.6.1 still imports pkg_resources, removed in setuptools 81.
  "setuptools==80.9.0",
  "imageio-ffmpeg==0.6.0",
]

[project.scripts]
vaporstep = "vaporstep.app:main"

[tool.setuptools.packages.find]
include = ["vaporstep*"]

[tool.setuptools_scm]
version_file = "vaporstep/_version.py"

[project.optional-dependencies]
build = [
  "pyinstaller==6.22.2",
  "pyinstaller-hooks-contrib==2026.6",
  "pytest>=8",
  "pillow>=10",
]
